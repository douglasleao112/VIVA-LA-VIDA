<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <script>
    const paginas = {
      off01: "https://vivalavidas.com/gelexpress/off01/",
      off02: "https://vivalavidas.com/gelexpress/off02/",
    };
    const storageKey = "gel-express-ab-variant";
    let variante;

    try {
      variante = window.localStorage.getItem(storageKey);
      if (!paginas[variante]) {
        variante = Math.random() < 0.5 ? "off01" : "off02";
        window.localStorage.setItem(storageKey, variante);
      }
    } catch {
      variante = Math.random() < 0.5 ? "off01" : "off02";
    }

    const destino = new URL(paginas[variante]);
    destino.search = window.location.search;
    destino.hash = window.location.hash;
    window.location.replace(destino.toString());
  </script>
</head>

<body>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <script>
    const paginas = {
      off01: "https://vivalavidas.com/gelexpress/off01/",
      off02: "https://vivalavidas.com/gelexpress/off02/",
      off03: "https://pay.hotmart.com/H107776419T?off=f6r8ti5i&checkoutMode=10"
    };

    const storageKey = "gel-express-ab-variant";
    let variante;

    try {
      variante = window.localStorage.getItem(storageKey);

      if (!paginas[variante]) {
        const sorteio = Math.random();

        if (sorteio < 1 / 3) {
          variante = "off01";
        } else if (sorteio < 2 / 3) {
          variante = "off02";
        } else {
          variante = "off03";
        }

        window.localStorage.setItem(storageKey, variante);
      }
    } catch {
      const sorteio = Math.random();

      if (sorteio < 1 / 3) {
        variante = "off01";
      } else if (sorteio < 2 / 3) {
        variante = "off02";
      } else {
        variante = "off03";
      }
    }

    const destino = new URL(paginas[variante]);

    // Pega UTMs e demais parâmetros recebidos na página atual
    const parametrosEntrada = new URLSearchParams(window.location.search);

    // Adiciona os parâmetros sem apagar os parâmetros originais da Hotmart
    parametrosEntrada.forEach((valor, chave) => {
      destino.searchParams.set(chave, valor);
    });

    // Mantém hash, caso exista
    destino.hash = window.location.hash;

    window.location.replace(destino.toString());
  </script>
</head>

<body>
</body>
</html>
